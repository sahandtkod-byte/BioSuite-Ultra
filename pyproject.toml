[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biosuite-ultra"
version = "5.0.0"
description = "BioSuite Ultra - Comprehensive open-source bioinformatics platform: 47 analysis modules, CLI, REST API, PyQt6 GUI, Jupyter notebooks"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Sahand Touri", email = "sahandtkod@gmail.com"},
]
maintainers = [
    {name = "Sahand Touri", email = "sahandtkod@gmail.com"},
]
keywords = [
    "bioinformatics", "genomics", "proteomics", "transcriptomics",
    "sequence-analysis", "ngs", "machine-learning", "molecular-cloning",
    "plasmid-maps", "phylogenetics", "metagenomics", "single-cell",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "tqdm>=4.66",
    "biopython>=1.83",
    "networkx>=3.0",
    "plotly>=5.18",
]

[project.optional-dependencies]
# Advanced bioinformatics (GO, GSEA, single-cell, etc.)
bio = [
    "goatools>=1.3",
    "gseapy>=1.0",
    "scanpy>=1.9",
    "anndata>=0.9",
    "scikit-bio>=0.5",
    "biotite>=0.37",
    "ete3>=3.1",
    "cobra>=3.0",
    "shap>=0.42",
    "umap-learn>=0.5",
    "statsmodels>=0.14",
    "pysam>=0.21",
]
# REST API
api = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.6",
]
# Jupyter notebook integration
notebook = [
    "ipython>=8.0",
    "ipywidgets>=8.0",
]
# PyQt6 GUI
gui = [
    "PyQt6>=6.5",
    "qasync>=0.23",
]
# Development tools
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-xdist>=3.0",
    "pytest-benchmark>=4.0",
    "ruff>=0.1",
    "mypy>=1.5",
    "bandit>=1.7",
    "types-requests",
]
# Everything
full = [
    "biosuite-ultra[bio,api,notebook,gui]",
]

[project.scripts]
biosuite = "biosuite.cli.menu:main_cli"
biosuite-gui = "biosuite.cli.menu:main_cli_gui"

[project.urls]
Homepage = "https://github.com/sahandtkod-byte/BioSuite-Ultra"
Documentation = "https://biosuite.readthedocs.io"
Repository = "https://github.com/sahandtkod-byte/BioSuite-Ultra"
Issues = "https://github.com/sahandtkod-byte/BioSuite-Ultra/issues"
Changelog = "https://github.com/sahandtkod-byte/BioSuite-Ultra/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["biosuite*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests",
]

[tool.ruff]
target-version = "py310"
line-length = 100
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "S101"]
exclude = [".git", "__pycache__", ".venv", "venv", "build", "dist"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["tests/", ".venv/", "build/", "dist/"]
