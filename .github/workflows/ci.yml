name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,notebook,dev]"
          pip install httpx

      - name: Run full test suite
        env:
          MPLBACKEND: Agg
          BIOSUITE_API_KEY: ci-test-key
        run: pytest tests/ -q --cov=biosuite --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff

      # Hard gate: syntax errors and undefined names must never merge.
      - name: Fatal checks (E9, F821)
        run: ruff check biosuite/ --select E9,F821

      # Advisory: full configured rule set; reported but not blocking
      # until the remaining style debt is paid down.
      - name: Full checks (advisory)
        continue-on-error: true
        run: ruff check biosuite/ --output-format=github
