name: ✨ Feature Request
description: Suggest a new feature or enhancement for BioSuite Ultra
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please fill out the details below.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Brief description of the feature
      placeholder: I'd like BioSuite Ultra to be able to...
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this feature needed? What problem does it solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe how you envision this working
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've tried

  - type: dropdown
    id: module
    attributes:
      label: Related Module
      options:
        - Core (alignment, assembly, variant calling)
        - GUI
        - CLI
        - REST API
        - Plotting/Visualization
        - Documentation
        - New module
        - Other

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Links, references, mockups, papers, etc.
